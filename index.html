<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Account Switcher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff;
      --surface: #f5f5f5;
      --border: rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.25);
      --text: #111;
      --text-muted: #666;
      --text-faint: #999;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --surface: #1e1e1e;
        --border: rgba(255,255,255,0.1);
        --border-strong: rgba(255,255,255,0.25);
        --text: #f0f0f0;
        --text-muted: #aaa;
        --text-faint: #666;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      max-width: 780px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.75rem;
    }

    .tt-icon {
      width: 30px; height: 30px;
      border-radius: 7px;
      background: #010101;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .account-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      cursor: pointer;
      position: relative;
      text-align: center;
      transition: border-color 0.15s;
    }

    .account-card:hover { border-color: var(--border-strong); }
    .account-card.active { border: 1.5px solid #fe2c55; }

    .avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 500;
      overflow: hidden;
    }

    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%;
    }

    .avatar-initials {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    .card-username {
      font-size: 14px; font-weight: 500;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .card-label {
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .active-badge {
      position: absolute; top: 8px; right: 8px;
      width: 8px; height: 8px;
      border-radius: 50%; background: #fe2c55;
    }

    .card-actions {
      display: flex; gap: 6px;
      margin-top: 10px; justify-content: center;
    }

    .btn-sm {
      font-size: 11px; padding: 3px 8px;
      border-radius: 5px;
      border: 0.5px solid var(--border-strong);
      background: transparent; color: var(--text-muted);
      cursor: pointer; font-family: var(--font);
    }

    .btn-sm:hover { background: var(--surface); }
    .btn-sm.danger:hover { color: #e24b4a; border-color: #e24b4a; }

    .btn-open {
      width: 100%; margin-top: 8px;
      padding: 6px; border-radius: 6px;
      border: 0.5px solid #fe2c55;
      background: transparent; color: #fe2c55;
      font-size: 12px; cursor: pointer;
      font-family: var(--font);
    }

    .btn-open:hover { background: rgba(254,44,85,0.07); }
    .btn-open.is-active { background: rgba(254,44,85,0.07); font-weight: 500; }

    .add-card {
      background: var(--surface);
      border: 0.5px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 1rem;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px; min-height: 160px;
      color: var(--text-faint);
      font-size: 13px;
      font-family: var(--font);
      transition: border-color 0.15s, color 0.15s;
    }

    .add-card:hover { border-color: var(--border-strong); color: var(--text-muted); }
    .plus { font-size: 22px; line-height: 1; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--bg);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 320px; max-width: 90vw;
    }

    .modal h2 {
      font-size: 16px; font-weight: 500;
      margin-bottom: 1rem; color: var(--text);
    }

    .field { margin-bottom: 12px; }

    .field label {
      display: block; font-size: 12px;
      color: var(--text-muted); margin-bottom: 4px;
    }

    .field input {
      width: 100%; padding: 7px 10px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-strong);
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 14px;
      outline: none;
    }

    .field input:focus { border-color: #fe2c55; }

    .color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

    .color-dot {
      width: 24px; height: 24px;
      border-radius: 50%; cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.1s;
    }

    .color-dot.selected { border-color: var(--text); }

    .modal-actions {
      display: flex; gap: 8px;
      margin-top: 1rem; justify-content: flex-end;
    }

    .btn-cancel {
      font-size: 13px; padding: 6px 14px;
      border-radius: 6px;
      border: 0.5px solid var(--border-strong);
      background: transparent; color: var(--text-muted);
      cursor: pointer; font-family: var(--font);
    }

    .btn-cancel:hover { background: var(--surface); }

    .btn-save {
      font-size: 13px; padding: 6px 14px;
      border-radius: 6px; border: none;
      background: #fe2c55; color: #fff;
      cursor: pointer; font-weight: 500;
      font-family: var(--font);
    }

    .btn-save:hover { background: #d91e47; }

    .password-row { display: flex; gap: 6px; }
    .password-row input { flex: 1; }

    .toggle-pw {
      font-size: 11px; padding: 0 10px;
      border-radius: 5px;
      border: 0.5px solid var(--border-strong);
      background: transparent; color: var(--text-muted);
      cursor: pointer; font-family: var(--font);
      white-space: nowrap;
    }

    .toggle-pw:hover { background: var(--surface); }

    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--bg);
      border: 0.5px solid var(--border-strong);
      border-radius: 20px; padding: 6px 18px;
      font-size: 13px; color: var(--text);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 200;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="tt-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.8a8.18 8.18 0 0 0 4.78 1.52V6.85a4.85 4.85 0 0 1-1.01-.16z"/>
      </svg>
    </div>
    <h1>TikTok accounts</h1>
  </div>

  <div id="grid" class="grid"></div>
  <div id="toast" class="toast"></div>

  <script>
    const COLORS = ['#ff6b6b','#f7b731','#20bf6b','#0fb9b1','#4b7bec','#a55eea','#fd9644','#fc5c65','#45aaf2','#2bcbba'];

    let accounts = JSON.parse(localStorage.getItem('tt_accounts') || '[]');
    let activeId = localStorage.getItem('tt_active') || null;
    let editingId = null;
    let showPw = false;
    let selectedColor = COLORS[4];

    function save() {
      localStorage.setItem('tt_accounts', JSON.stringify(accounts));
      localStorage.setItem('tt_active', activeId || '');
    }

    function initials(username) {
      return username.replace('@', '').slice(0, 2).toUpperCase() || 'TT';
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.opacity = '1';
      setTimeout(() => el.style.opacity = '0', 1800);
    }

    function openTikTok(username) {
      window.open('https://www.tiktok.com/@' + username.replace('@', ''), '_blank');
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      accounts.forEach(acc => {
        const card = document.createElement('div');
        card.className = 'account-card' + (acc.id === activeId ? ' active' : '');

        const avatarInner = acc.pic
          ? `<img src="${acc.pic}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
             <span class="avatar-initials" style="display:none;color:${acc.color};">${initials(acc.username)}</span>`
          : `<span class="avatar-initials" style="color:${acc.color};">${initials(acc.username)}</span>`;

        card.innerHTML = `
          ${acc.id === activeId ? '<div class="active-badge"></div>' : ''}
          <div class="avatar" style="background:${acc.color}22;">${avatarInner}</div>
          <div class="card-username">${acc.username || '—'}</div>
          <div class="card-label">${acc.label || acc.email || ''}</div>
          <div class="card-actions">
            <button class="btn-sm" onclick="copyPw('${acc.id}')">Copy pw</button>
            <button class="btn-sm" onclick="openEdit('${acc.id}')">Edit</button>
            <button class="btn-sm danger" onclick="deleteAcc('${acc.id}')">Del</button>
          </div>
          <button class="btn-open ${acc.id === activeId ? 'is-active' : ''}" onclick="setActive('${acc.id}')">
            ${acc.id === activeId ? 'Active' : 'Switch to this'}
          </button>
        `;
        grid.appendChild(card);
      });

      const addBtn = document.createElement('div');
      addBtn.className = 'add-card';
      addBtn.innerHTML = '<div class="plus">+</div><span>Add account</span>';
      addBtn.onclick = openAdd;
      grid.appendChild(addBtn);
    }

    function setActive(id) {
      activeId = id;
      save();
      render();
      const acc = accounts.find(a => a.id === id);
      if (acc) openTikTok(acc.username);
    }

    function copyPw(id) {
      const acc = accounts.find(a => a.id === id);
      if (!acc || !acc.password) return toast('No password saved');
      navigator.clipboard.writeText(acc.password).then(() => toast('Password copied'));
    }

    function deleteAcc(id) {
      if (!confirm('Delete this account?')) return;
      accounts = accounts.filter(a => a.id !== id);
      if (activeId === id) activeId = null;
      save();
      render();
    }

    function openAdd() {
      editingId = null;
      showPw = false;
      selectedColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      showModal({});
    }

    function openEdit(id) {
      editingId = id;
      showPw = false;
      const acc = accounts.find(a => a.id === id);
      selectedColor = acc.color || COLORS[4];
      showModal(acc);
    }

    function showModal(acc) {
      const existing = document.getElementById('modal-overlay');
      if (existing) existing.remove();

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <h2>${editingId ? 'Edit account' : 'Add account'}</h2>
          <div class="field">
            <label>Username</label>
            <input id="f-username" type="text" placeholder="@yourhandle" value="${acc.username || ''}">
          </div>
          <div class="field">
            <label>Label (optional)</label>
            <input id="f-label" type="text" placeholder="Personal, Brand, Work…" value="${acc.label || ''}">
          </div>
          <div class="field">
            <label>Email</label>
            <input id="f-email" type="email" placeholder="email@example.com" value="${acc.email || ''}">
          </div>
          <div class="field">
            <label>Password</label>
            <div class="password-row">
              <input id="f-password" type="password" placeholder="stored locally only" value="${acc.password || ''}">
              <button class="toggle-pw" id="toggle-pw-btn">Show</button>
            </div>
          </div>
          <div class="field">
            <label>Profile pic URL (optional)</label>
            <input id="f-pic" type="text" placeholder="https://..." value="${acc.pic || ''}">
          </div>
          <div class="field">
            <label>Color</label>
            <div class="color-row" id="color-row">
              ${COLORS.map(c => `<div class="color-dot${c === selectedColor ? ' selected' : ''}" style="background:${c}" data-color="${c}"></div>`).join('')}
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" id="modal-cancel">Cancel</button>
            <button class="btn-save" id="modal-save">Save</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      document.getElementById('modal-cancel').onclick = () => overlay.remove();
      overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

      document.getElementById('toggle-pw-btn').onclick = () => {
        showPw = !showPw;
        document.getElementById('f-password').type = showPw ? 'text' : 'password';
        document.getElementById('toggle-pw-btn').textContent = showPw ? 'Hide' : 'Show';
      };

      document.querySelectorAll('.color-dot').forEach(dot => {
        dot.onclick = () => {
          selectedColor = dot.dataset.color;
          document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
          dot.classList.add('selected');
        };
      });

      document.getElementById('modal-save').onclick = () => {
        const username = document.getElementById('f-username').value.trim();
        if (!username) { alert('Username is required'); return; }
        const data = {
          username,
          label: document.getElementById('f-label').value.trim(),
          email: document.getElementById('f-email').value.trim(),
          password: document.getElementById('f-password').value,
          pic: document.getElementById('f-pic').value.trim(),
          color: selectedColor,
        };
        if (editingId) {
          const idx = accounts.findIndex(a => a.id === editingId);
          accounts[idx] = { ...accounts[idx], ...data };
        } else {
          data.id = Date.now().toString();
          accounts.push(data);
        }
        save();
        render();
        overlay.remove();
      };
    }

    render();
  </script>
</body>
</html>
